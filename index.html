<meta charset="utf-8">

<title>iiSolutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Inter+Tight:wght@500;600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
[hidden]{display:none !important}
body{margin:0;background:#FFFFFF;color:#00294E;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.pm a{color:#43762D;text-decoration:none}
.pm a:hover{color:#00294E;text-decoration:underline}
.pm .wrap{max-width:1264px;margin:0 auto;padding:0 32px;box-sizing:border-box;width:100%}
.pm .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.pm .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.pm .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.pm .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;font:600 15px/1 Inter,sans-serif;border:1px solid #00294E;box-sizing:border-box;cursor:pointer;text-decoration:none}
.pm .btn-ink{background:#00294E;color:#FFFFFF}
.pm .btn-ink:hover{background:#43762D;border-color:#43762D;color:#FFFFFF;text-decoration:none}
.pm .btn-line{background:transparent;color:#00294E}
.pm .btn-line:hover{background:#00294E;color:#FFFFFF;text-decoration:none}
.pm .btn-green{background:#74B359;border-color:#74B359;color:#00294E}
.pm .btn-green:hover{background:#FFFFFF;border-color:#FFFFFF;color:#00294E;text-decoration:none}
.pm .nav a{color:#00294E;font:500 15px/1 Inter,sans-serif;padding:12px 0}
.pm .nav a:hover{color:#43762D;text-decoration:none}
.pm .lang{all:unset;box-sizing:border-box;min-width:44px;min-height:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;font:500 13px/1 'IBM Plex Mono',monospace;cursor:pointer;color:#DFE9C7;border:1px solid transparent}
.pm .lang:hover{color:#FFFFFF;border-color:rgba(255,255,255,.4)}
.pm .lang-on{color:#00294E;background:#FFFFFF}
.pm .lang-on:hover{color:#00294E}
.pm .lang:focus-visible,.pm .faq-q:focus-visible{outline:2px solid #74B359;outline-offset:2px}
.pm .faq-q{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px 0;cursor:pointer;font:600 20px/1.3 'Inter Tight',sans-serif;color:#00294E}
.pm .idx{font:500 13px/1.4 'IBM Plex Mono',monospace;letter-spacing:.03em;color:#43762D;display:flex;gap:12px;align-items:center}
.pm .idx::after{content:"";flex:0 0 48px;height:1px;background:#D9DDD3}
@media (max-width:1080px){.pm .g3,.pm .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.pm .nav{display:none !important}}
@media (max-width:760px){.pm .wrap{padding:0 16px}
.pm .g2,.pm .g3,.pm .g4{grid-template-columns:minmax(0,1fr)}
.pm .h1{font-size:40px !important}
.pm .h2{font-size:32px !important}
.pm .hide-s{display:none !important}}
.pv a{color:#43762D;text-decoration:none}
.pv a:hover{color:#00294E;text-decoration:underline}
.pv .wrap{max-width:1264px;margin:0 auto;padding:0 32px;box-sizing:border-box;width:100%}
.pv .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.pv .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 28px;font:600 16px/1 Inter,sans-serif;border:1px solid #00294E;box-sizing:border-box;cursor:pointer;text-decoration:none}
.pv .btn-ink{background:#00294E;color:#FFFFFF}
.pv .btn-ink:hover{background:#43762D;border-color:#43762D;color:#FFFFFF;text-decoration:none}
.pv .btn-line{background:#FFFFFF;color:#00294E;min-height:44px;padding:0 20px;font-size:15px}
.pv .btn-line:hover{background:#00294E;color:#FFFFFF;text-decoration:none}
.pv .lang{all:unset;box-sizing:border-box;min-width:44px;min-height:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;font:500 13px/1 'IBM Plex Mono',monospace;cursor:pointer;color:#DFE9C7;border:1px solid transparent}
.pv .lang:hover{color:#FFFFFF;border-color:rgba(255,255,255,.4)}
.pv .lang-on{color:#00294E;background:#FFFFFF}
.pv .lang-on:hover{color:#00294E}
.pv .lang:focus-visible,.pv .demo:focus-visible{outline:2px solid #74B359;outline-offset:2px}
.pv .code-in{box-sizing:border-box;width:100%;min-height:64px;padding:0 20px;border:1px solid #00294E;background:#FFFFFF;color:#00294E;font:500 24px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.pv .code-in::placeholder{color:#5B625A;opacity:.7}
.pv .code-in:focus{outline:2px solid #74B359;outline-offset:0}
.pv .demo{all:unset;cursor:pointer;font:500 13px/1 'IBM Plex Mono',monospace;color:#43762D;border-bottom:1px solid #B5D191;padding:6px 0}
.pv .demo:hover{color:#00294E}
.pv .idx{font:500 13px/1.4 'IBM Plex Mono',monospace;letter-spacing:.03em;color:#43762D;display:flex;gap:12px;align-items:center}
.pv .idx::after{content:"";flex:0 0 48px;height:1px;background:#D9DDD3}
@media (max-width:860px){.pv .g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.pv .wrap{padding:0 16px}
.pv .h1{font-size:36px !important}
.pv .hide-s{display:none !important}
.pv .form-row{flex-direction:column}
.pv .form-row .btn{width:100%}}
.pv{min-height:100vh;display:flex;flex-direction:column}
.pv > div{flex-grow:1}
@media (max-width:760px){.pm header .btn{padding:0 12px;min-width:48px}.pm header img,.pv header img{height:48px !important}}

:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
/* первый экран: шкала роста из системных дуг */
.pm .hero{position:relative;overflow:hidden;background:#FFFFFF;min-height:clamp(640px,calc(100vh - 150px),880px);display:flex;align-items:center}
.pm .hero-grid{position:relative;z-index:1;padding-top:80px;padding-bottom:96px}
.pm .hero-txt{display:flex;flex-direction:column;gap:28px;min-width:0}
.pm .hero-art{--art:clamp(600px,58vw,1000px);position:absolute;top:50%;left:calc(50% + 16px);width:var(--art);height:var(--art);margin-top:calc(var(--art) / -2);pointer-events:none}
.pm .hero-art svg{display:block;width:100%;height:100%;overflow:visible}
.pm .arc,.pm .garc{transform-box:view-box}
.pm .arc{transform-origin:400px 400px;will-change:transform}
.pm .arc .trk,.pm .arc .fil{fill:none;stroke-width:32}
.pm .garc .trk,.pm .garc .fil{fill:none;stroke-width:7.8}
.pm .arc .trk{stroke:#DFE9C7}
.pm .arc .fil,.pm .garc .fil{stroke:#74B359;stroke-dasharray:1 1;stroke-dashoffset:0}
.pm .garc .trk{stroke:rgba(223,233,199,.16)}
.pm .arc .lab{font:500 15px 'IBM Plex Mono',monospace;fill:#00294E;text-anchor:middle;dominant-baseline:middle}
.pm .garc text{font:400 9px 'IBM Plex Mono',monospace;fill:#FFFFFF;text-anchor:middle;dominant-baseline:middle}
.pm .hero-read{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pm .hero-num{font:500 112px/1 'IBM Plex Mono',monospace;color:#00294E;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pm .hero-cap{font:600 12px/1.4 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#43762D;max-width:180px}
@keyframes ii-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ii-fade{from{opacity:0}to{opacity:1}}
@keyframes ii-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.intro .pm .arc .trk{animation:ii-fade 600ms var(--ease-out) both;animation-delay:calc(var(--i) * 80ms)}
.intro .pm .arc .fil{animation:ii-draw 1100ms var(--ease-out) both;animation-delay:calc(400ms + var(--i) * 450ms)}
.intro .pm .arc .lab{animation:ii-fade 400ms var(--ease-out) both;animation-delay:calc(1200ms + var(--i) * 450ms)}
.intro .pm .hero-read{animation:ii-fade 500ms var(--ease-out) both;animation-delay:300ms}
.intro .pm .hero-txt > *{animation:ii-rise 700ms var(--ease-out) both}
.intro .pm .hero-txt > :nth-child(2){animation-delay:60ms}
.intro .pm .hero-txt > :nth-child(3){animation-delay:120ms}
.intro .pm .hero-txt > :nth-child(4){animation-delay:180ms}
.intro .pm .hero-txt > :nth-child(5){animation-delay:240ms}
/* интро шкалы ждёт, пока до неё долистают: заставка стоит выше */
.intro .pm .hero .arc .trk,.intro .pm .hero .arc .fil,.intro .pm .hero .arc .lab,.intro .pm .hero .hero-read,.intro .pm .hero .hero-txt > *{animation-play-state:paused}
.intro .pm .hero.play .arc .trk,.intro .pm .hero.play .arc .fil,.intro .pm .hero.play .arc .lab,.intro .pm .hero.play .hero-read,.intro .pm .hero.play .hero-txt > *{animation-play-state:running}
.pm .hero{border-top:1px solid #D9DDD3}
/* заставка: знак собирается вращением дуг */
.pm .stage{position:relative;min-height:max(560px,calc(100svh - 140px));display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FFFFFF;overflow:hidden;padding:48px 16px 120px;box-sizing:border-box;text-align:center}
.pm .stage-in{display:flex;flex-direction:column;align-items:center;gap:20px}
.pm .lg{display:block;width:min(720px,86vw);height:auto;overflow:visible}
.pm .lg-arc{transform-box:view-box}
.pm .lg-wipe,.pm .lg-dot{transform-box:fill-box}
.pm .lg-wipe{transform-origin:0 50%}
.pm .stage-slogan{margin:8px 0 0;font:600 40px/1.15 'Inter Tight',sans-serif;letter-spacing:-.02em;color:#00294E;text-wrap:balance;max-width:760px}
.pm .stage-sub{margin:0;font:500 13px/1.5 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#43762D}
.pm .stage-cue{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5B625A;padding:8px}
.pm .stage-cue:hover{color:#00294E;text-decoration:none}
.pm .stage-cue:focus-visible{outline:2px solid #74B359;outline-offset:2px}
@keyframes lg-spin{from{transform:rotate(var(--r0))}to{transform:rotate(0deg)}}
@keyframes lg-wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lg-slide{from{transform:translateX(-24px)}to{transform:translateX(0)}}
@keyframes lg-dot{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
.intro .pm .lg-arc{animation:lg-spin var(--dur) cubic-bezier(0.16,1,0.3,1) both,ii-fade 500ms var(--ease-out) both;animation-delay:calc(var(--i) * 90ms)}
.intro .pm .lg-wipe{animation:lg-wipe 800ms var(--ease-in-out) 1500ms both}
.intro .pm .lg-word{animation:lg-slide 900ms var(--ease-out) 1500ms both}
.intro .pm .lg-dot{animation:lg-dot 600ms var(--ease-out) 2250ms both}
.intro .pm .stage-slogan{animation:ii-rise 700ms var(--ease-out) 2450ms both}
.intro .pm .stage-sub{animation:ii-rise 700ms var(--ease-out) 2600ms both}
.intro .pm .stage-cue{animation:ii-fade 600ms var(--ease-out) 3100ms both}
@media (max-width:760px){.pm .stage-slogan{font-size:28px}.pm .stage{min-height:max(480px,calc(100svh - 120px))}}
/* шкала курса: дуги дорисовываются при появлении */
.js .pm .gs .fil{stroke-dashoffset:1;transition:stroke-dashoffset 1100ms var(--ease-out);transition-delay:calc(200ms + var(--i) * 350ms)}
.js .pm .gs text{opacity:0;transition:opacity 400ms var(--ease-out);transition-delay:calc(900ms + var(--i) * 350ms)}
.js .pm .gs.in .fil{stroke-dashoffset:0}
.js .pm .gs.in text{opacity:1}
/* появление при прокрутке, один раз */
.js .pm .rv{opacity:0;transform:translateY(24px);transition:opacity 700ms var(--ease-out),transform 700ms var(--ease-out);transition-delay:calc(var(--d,0) * 70ms)}
.js .pm .rv.in{opacity:1;transform:translateY(0)}
.pm .ph{overflow:hidden;background:#EDEFE9}
.pm .ph img{display:block;width:100%;height:100%;object-fit:cover}
.js .pm .rv-img{clip-path:inset(100% 0 0 0);transition:clip-path 900ms var(--ease-in-out);transition-delay:calc(var(--d,0) * 70ms)}
.js .pm .rv-img img{transform:scale(1.08);transition:transform 1400ms var(--ease-out);transition-delay:calc(var(--d,0) * 70ms)}
.js .pm .rv-img.in{clip-path:inset(0 0 0 0)}
.js .pm .rv-img.in img{transform:scale(1)}
.pm .now,.pm .now *{transition:none !important}
/* научный подход */
.pm .ap{background:#00294E;color:#FFFFFF}
.pm .idx-dk{color:#74B359}
.pm .idx-dk::after{background:rgba(255,255,255,.24)}
.pm .ap-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px}
.pm .ap-row .ph{height:520px}
.pm .ap figure{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.pm .ap figcaption,.pm .fig{font:400 12px/1.4 'IBM Plex Mono',monospace;letter-spacing:.03em;color:#B5D191}
.pm .ap-card{display:flex;flex-direction:column;gap:16px;min-width:0}
.pm .ap-card .ph{aspect-ratio:4/5}
.pm .ap-n{font:500 15px/1 'IBM Plex Mono',monospace;color:#74B359;padding-top:8px}
.pm .ap-card h3{margin:0;font:600 24px/1.25 'Inter Tight',sans-serif;letter-spacing:-.015em;color:#FFFFFF}
.pm .ap-card p{margin:0;font:400 15px/1.6 Inter,sans-serif;color:#DFE9C7}
.pm .sci-ph{aspect-ratio:16/9;margin:-40px -40px 0}
@media (max-width:1080px){
.pm .hero{display:flex;flex-direction:column;align-items:stretch;min-height:0}
.pm .hero-grid{order:1;grid-template-columns:minmax(0,1fr);padding-bottom:16px}
.pm .hero-art{order:2;position:relative;top:auto;left:auto;margin:0 0 0 12%;width:100%;height:auto;aspect-ratio:1}
.pm .hero-num{font-size:80px}
.pm .ap-row{grid-template-columns:minmax(0,1fr)}
.pm .ap-row .ph{height:auto;aspect-ratio:4/3}}
@media (max-width:760px){.pm .sci-ph{margin:-24px -24px 0}.pm .hero-num{font-size:64px}.pm .hero-cap{font-size:11px}}
@media (prefers-reduced-motion:reduce){
.intro .pm .arc .trk,.intro .pm .arc .fil,.intro .pm .arc .lab,.intro .pm .hero-txt > *,.intro .pm .lg-arc,.intro .pm .lg-word,.intro .pm .lg-dot,.intro .pm .stage-slogan,.intro .pm .stage-sub,.intro .pm .stage-cue{animation:ii-fade 300ms ease both;animation-delay:0ms}
.intro .pm .lg-wipe{animation:none}
.js .pm .rv{transform:none;transition:opacity 300ms ease}
.js .pm .rv-img{clip-path:none;opacity:0;transition:opacity 300ms ease}
.js .pm .rv-img.in{opacity:1}
.js .pm .rv-img img{transform:none}
.js .pm .gs .fil{stroke-dashoffset:0;transition:none}
.js .pm .gs text{opacity:1;transition:none}}
</style>
</head>
<body>
<div id="view-main" class="pm"></div>
<div id="view-verify" class="pv" hidden></div>
<template id="tpl-main"><div style="width: 100%; min-width: 0; display: flex; flex-direction: column">

<!-- узкая полоса: дескриптор + языки -->
<div style="background: #00294E; color: #FFFFFF">
<div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px; padding-top: 8px; padding-bottom: 8px">
<span style="font: 600 12px/1.4 Inter, sans-serif; letter-spacing: 0.08em; text-transform: uppercase">Professional Hair Regrowth Product</span>
<div style="display: flex; align-items: center; gap: 16px">
<span class="hide-s" style="font: 400 13px/1.4 Inter, sans-serif; color: #DFE9C7">{{t.bandNote}}</span>
<div role="group" aria-label="Language" style="display: flex; gap: 4px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button type="button" class="{{l.cls}}" aria-pressed="{{l.pressed}}" aria-label="{{l.full}}" onClick="{{l.pick}}">{{l.code}}</button>
</sc-for>
</div>
</div>
</div>
</div>

<div aria-live="polite" style="display: flex; flex-direction: column">
<sc-if value="{{r.ok}}" hint-placeholder-val="{{false}}">
<div style="border: 1px solid #D9DDD3; border-top: 4px solid #43762D; background: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; gap: 16px; align-items: flex-start">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#43762D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font: 600 26px/1.2 'Inter Tight', sans-serif; color: #00294E">{{t.okH}}</span>
<span style="font: 400 15px/1.6 Inter, sans-serif; color: #00294E">{{t.okP}}</span>
</div>
</div>
<dl style="margin: 0; display: flex; flex-direction: column; border-top: 1px solid #D9DDD3">
<sc-for list="{{r.rows}}" as="row" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #D9DDD3">
<dt style="font: 400 14px/1.4 Inter, sans-serif; color: #5B625A">{{row.k}}</dt>
<dd style="margin: 0; font: 400 14px/1.4 'IBM Plex Mono', monospace; color: #00294E; text-align: right">{{row.v}}</dd>
</div>
</sc-for>
</dl>
</div>
</sc-if>

<sc-if value="{{r.repeat}}" hint-placeholder-val="{{false}}">
<div style="border: 1px solid #D9DDD3; border-top: 4px solid #B3191F; background: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; gap: 16px; align-items: flex-start">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#B3191F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17v.5"/></svg>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font: 600 26px/1.2 'Inter Tight', sans-serif; color: #00294E">{{r.repeatH}}</span>
<span style="font: 400 15px/1.6 Inter, sans-serif; color: #00294E">{{t.repeatP}}</span>
</div>
</div>
<dl style="margin: 0; display: flex; flex-direction: column; border-top: 1px solid #D9DDD3">
<sc-for list="{{r.rows}}" as="row" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #D9DDD3">
<dt style="font: 400 14px/1.4 Inter, sans-serif; color: #5B625A">{{row.k}}</dt>
<dd style="margin: 0; font: 400 14px/1.4 'IBM Plex Mono', monospace; color: #00294E; text-align: right">{{row.v}}</dd>
</div>
</sc-for>
</dl>
<div><a class="btn btn-line" href="#report">{{t.report}}</a></div>
</div>
</sc-if>

<sc-if value="{{r.none}}" hint-placeholder-val="{{false}}">
<div style="border: 1px solid #D9DDD3; border-top: 4px solid #B3191F; background: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; gap: 16px; align-items: flex-start">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#B3191F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6"/><path d="M15 9l-6 6"/></svg>

<span style="font: 400 15px/1.6 Inter, sans-serif; color: #00294E">{{t.noneP}}</span>
</div>
</div>
<div><a class="btn btn-line" href="#report">{{t.report}}</a></div>
</div>
</sc-if>

<sc-if value="{{r.empty}}" hint-placeholder-val="{{false}}">

var EVT = { onclick: 'click', onsubmit: 'submit', onchange: 'input' };
function lookup(expr, scope) {
  expr = expr.trim();
